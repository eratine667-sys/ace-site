<!DOCTYPE html>
<html>
<head>
    <title>Кто к доске?</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f4f8; }
        .card { background: white; padding: 50px; border-radius: 15px; display: inline-block; margin-top: 100px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; background: #4CAF50; color: white; border: none; border-radius: 5px; }
        #name { font-size: 40px; color: #333; margin-bottom: 20px; height: 50px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="name">Нажми кнопку...</div>
        <button onclick="pickStudent()">Выбрать ученика</button>
    </div>

    <script>
        const students = ["Иван Иванов", "Мария Петрова", "Алексей Сидоров"]; // Список класса
        function pickStudent() {
            const random = Math.floor(Math.random() * students.length);
            document.getElementById('name').innerText = students[random];
        }
    </script>
</body>
</html>
