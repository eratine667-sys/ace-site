<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VirtuX VPN</title>
    <style>
        body { background-color: #0b0b0b; color: white; font-family: 'Arial Black', Gadget, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #151515; padding: 40px; border-radius: 20px; box-shadow: 0 0 40px rgba(255,0,0,0.2); width: 420px; text-align: center; border: 1px solid #222; }
        
        .logo { font-size: 45px; margin-bottom: 30px; letter-spacing: -2px; }
        .red { color: #ff0000; }
        .white { color: #ffffff; }

        .input-box { margin-bottom: 20px; text-align: left; }
        label { font-size: 10px; color: #555; letter-spacing: 2px; margin-left: 5px; }
        input { width: 100%; padding: 15px; border-radius: 5px; border: 1px solid #333; background: #000; color: #ff0000; box-sizing: border-box; outline: none; margin-top: 5px; }
        
        .btn-main { width: 100%; padding: 18px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; background: #ff0000; color: white; font-size: 16px; transition: 0.2s; }
        .btn-main:hover { background: #b30000; transform: scale(1.02); }

        #panel { display: none; }
        .server-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        
        .server-card { 
            background: #1a1a1a; padding: 20px; border-radius: 10px; border: 1px solid #333; 
            cursor: pointer; transition: 0.3s; position: relative; overflow: hidden;
        }
        .server-card:hover { border-color: #ff0000; }
        .server-card.active { border-color: #ff0000; background: #250000; box-shadow: 0 0 15px rgba(255,0,0,0.4); }
        
        .flag { font-size: 30px; display: block; margin-bottom: 10px; }
        .name { font-size: 12px; text-transform: uppercase; color: #ccc; }
        
        .status-led { width: 10px; height: 10px; background: #333; border-radius: 50%; display: inline-block; margin-right: 10px; }
        .active .status-led { background: #ff0000; box-shadow: 0 0 8px #ff0000; }

        .error-msg { color: #ff0000; font-size: 12px; margin-top: 15px; display: none; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo"><span class="red">virtu</span><span class="white">x</span> <span class="white">vpn</span></div>

    <!-- LOGIN SECTION -->
    <div id="auth">
        <div class="input-box">
            <label>ADMIN IDENTIFIER</label>
            <input type="text" id="username" placeholder="LOGIN">
        </div>
        <div class="input-box">
            <label>SECRET KEY</label>
            <input type="password" id="password" placeholder="PASSWORD">
        </div>
        <button class="btn-main" onclick="checkAuth()">ENTER PANEL</button>
        <div id="err" class="error-msg">ACCESS DENIED: INVALID CREDENTIALS</div>
    </div>

    <!-- SERVER SELECTION SECTION -->
    <div id="panel">
        <div style="font-size: 11px; color: #ff0000; margin-bottom: 20px;">SYSTEM ONLINE - SELECT NODE</div>
        <div class="server-grid">
            <div class="server-card" onclick="connect(this)">
                <span class="flag">🇩🇪</span>
                <span class="name">Germany</span>
                <div class="status-led"></div>
            </div>
            <div class="server-card" onclick="connect(this)">
                <span class="flag">🇺🇸</span>
                <span class="name">USA</span>
                <div class="status-led"></div>
            </div>
            <div class="server-card" onclick="connect(this)">
                <span class="flag">🇷🇺</span>
                <span class="name">Russia</span>
                <div class="status-led"></div>
            </div>
            <div class="server-card" onclick="connect(this)">
                <span class="flag">👾</span>
                <span class="name">Discord</span>
                <div class="status-led"></div>
            </div>
        </div>
        <button class="btn-main" style="margin-top:30px; background: none; border: 1px solid #333;" onclick="location.reload()">LOGOUT</button>
    </div>
</div>

<script>
function checkAuth() {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    
    // Прямая проверка данных
    if (u === 'loqin' && p === 'house2233') {
        document.getElementById('auth').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
    } else {
        const error = document.getElementById('err');
        error.style.display = 'block';
        setTimeout(() => { error.style.display = 'none'; }, 2000);
    }
}

function connect(element) {
    // Убираем активный статус у всех и ставим нажатому
    document.querySelectorAll('.server-card').forEach(card => card.classList.remove('active'));
    element.classList.add('active');
    
    // Можно добавить звук или вибрацию для эффекта
    console.log("Connecting to: " + element.querySelector('.name').innerText);
}
</script>

</body>
</html>
