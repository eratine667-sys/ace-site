<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Interface</title>
    <style>
        /* Базовые стили для фона */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000; /* Черный фон */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff; /* Белый текст */
        }

        /* Контейнер */
        .container {
            text-align: center;
        }

        /* Заголовок (опционально) */
        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Стильная кнопка */
        .connect-btn {
            background-color: transparent;
            color: #ff0000; /* Красный текст */
            border: 2px solid #ff0000; /* Красная рамка */
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        /* Эффект при наведении */
        .connect-btn:hover {
            background-color: #ff0000; /* Красный фон */
            color: #ffffff; /* Белый текст */
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); /* Красное свечение */
        }

        /* Эффект при нажатии */
        .connect-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Система готова</h1>
        <button class="connect-btn">Подключиться</button>
    </div>

</body>
</html>
