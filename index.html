<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VirtuX VPN</title>
    <style>
        body { background-color: #121212; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 350px; text-align: center; border: 1px solid #333; }
        h1 { font-size: 32px; margin-bottom: 25px; letter-spacing: 2px; }
        .red-text { color: #ff0000; }
        .white-text { color: #ffffff; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; margin-left: 5px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #252525; color: white; box-sizing: border-box; outline: none; }
        input:focus { border-color: #ff0000; }
        .btn { width: 100%; padding: 15px; margin-top: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-connect { background-color: #ff0000; color: white; }
        .btn-connect:hover { background-color: #cc0000; }
        .btn-disconnect { background-color: transparent; color: #888; border: 1px solid #333; margin-top: 15px; }
        .btn-disconnect:hover { color: white; border-color: white; }
        .status { margin-top: 20px; font-size: 13px; color: #555; }
        .status span { color: #ff0000; }
    </style>
</head>
<body>

<div class="container">
    <h1><span class="red-text">virtu</span><span class="white-text">x</span> <span class="white-text">vpn</span></h1>
    
    <div class="input-group">
        <label>SERVER ADDRESS</label>
        <input type="text" placeholder="1.2.3.4">
    </div>
    
    <div class="input-group">
        <label>USERNAME</label>
        <input type="text" placeholder="virtux_user">
    </div>
    
    <div class="input-group">
        <label>PASSWORD</label>
        <input type="password" placeholder="••••••••">
    </div>

    <button class="btn btn-connect">CONNECT</button>
    <button class="btn btn-disconnect">DISCONNECT</button>

    <div class="status">Status: <span>DISCONNECTED</span></div>
</div>

</body>
</html>
