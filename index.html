    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            padding: 30px 0;
        }
        
        .header h1 {
            font-size: 4em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: glow 2s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 10px #fff, 0 0 20px #fff; }
            to { text-shadow: 0 0 20px #fff, 0 0 30px #ff00de; }
        }
        
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 40px 0;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }
        
        .btn-accounts {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        
        .btn-accounts:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }
        
        .content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .account-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s;
        }
        
        .account-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.25);
        }
        
        .account-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            padding-bottom: 10px;
            word-break: break-word;
        }
        
        .account-info {
            margin: 10px 0;
            font-size: 0.95em;
        }
        
        .account-info span {
            color: #4ecdc4;
            font-weight: bold;
        }
        
        .copy-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 15px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            transition: all 0.3s;
        }
        
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .search-box {
            margin: 20px 0;
        }
        
        .search-box input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1.1em;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>

        // Показать все аккаунты

        // Отобразить аккаунты
        function displayAccounts(accountsToShow) {
            const grid = document.getElementById('accountsGrid');
            const totalSpan = document.getElementById('totalAccounts');
            
            grid.innerHTML = '';
            let count = 0;
            
            for (const [nickname, data] of Object.entries(accountsToShow)) {
                count++;
                const card = document.createElement('div');
                card.className = 'account-card';
                card.innerHTML = `
                    <div class="account-name">${nickname}</div>
                    <div class="account-info"><span>IP:</span> ${data.ip}</div>
                    <div class="account-info"><span>Пароль:</span> ${data.password}</div>
                    <button class="copy-btn" onclick='copyAccount(${JSON.stringify(nickname)}, ${JSON.stringify(data.ip)}, ${JSON.stringify(data.password)})'>
                        📋 Копировать данные
                    </button>
                `;
                grid.appendChild(card);
            }
            
            totalSpan.textContent = count;
        }

        // Поиск аккаунтов
        function searchAccounts() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            if (searchText === '') {
                displayAccounts(accounts);
                return;
            }
            
            const filtered = {};
            for (const [nickname, data] of Object.entries(accounts)) {
                if (nickname.toLowerCase().includes(searchText)) {
                    filtered[nickname] = data;
                }
            }
            
            displayAccounts(filtered);
        }

        // Копировать аккаунт
        function copyAccount(nickname, ip, password) {
            const text = `Ник: ${nickname}\nIP: ${ip}\nПароль: ${password}`;
            navigator.clipboard.writeText(text).then(() => {
                alert(`✅ Аккаунт "${nickname}" скопирован!`);
            }).catch(() => {
                alert('❌ Ошибка копирования');
            });
        }

        // Показать все аккаунты при загрузке
        window.onload = showAccounts;
