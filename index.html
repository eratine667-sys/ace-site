<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VirtuX VPN</title>
    <style>
        body { background-color: #0c0c0c; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { 
            background-color: #1a1a1a; padding: 40px; border-radius: 20px; 
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4); width: 380px; 
            text-align: center; border: 2px solid #ff0000; 
        }
        h1 { font-size: 40px; margin-bottom: 30px; letter-spacing: 2px; font-weight: 900; text-transform: uppercase; }
        .red-text { color: #ff0000; }
        .white-text { color: #ffffff; }

        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 11px; color: #777; margin-bottom: 8px; font-weight: bold; }
        input { 
            width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333; 
            background: #222; color: white; box-sizing: border-box; outline: none; font-size: 16px;
        }
        input:focus { border-color: #ff0000; }

        .btn { 
            width: 100%; padding: 16px; border: none; border-radius: 10px; 
            font-weight: 900; cursor: pointer; transition: 0.3s; font-size: 14px; 
        }
        .btn-connect { background-color: #ff0000; color: white; margin-top: 10px; }
        .btn-connect:hover { background-color: #cc0000; transform: scale(1.02); }

        #server-panel { display: none; }
        
        .server-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; max-height: 300px; overflow-y: auto; padding-right: 5px; }
        .server-item { 
            background: #252525; padding: 15px; border-radius: 12px; border: 1px solid #333; 
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 15px;
        }
        .server-item:hover { border-color: #ff0000; background: #2a1010; }
        .server-item.active { border-color: #ff0000; background: #350505; box-shadow: 0 0 15px rgba(255,0,0,0.3); }

        .flag-img { width: 45px; height: 30px; border-radius: 4px; object-fit: cover; border: 1px solid #444; }
        .server-info { text-align: left; }
        .server-name { display: block; font-weight: bold; font-size: 14px; }
        .server-status { font-size: 10px; color: #00ff00; }

        .error { color: #ff0000; font-size: 12px; margin-top: 15px; display: none; font-weight: bold; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #ff0000; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1><span class="red-text">virtu</span><span class="white-text">x</span> <span class="white-text">vpn</span></h1>

    <!-- ФОРМА ВХОДА -->
    <div id="login-form">
        <div class="input-group">
            <label>ADMIN LOGIN</label>
            <input type="text" id="user" placeholder="Login">
        </div>
        <div class="input-group">
            <label>PASSWORD</label>
            <input type="password" id="pass" placeholder="Password">
        </div>
        <button class="btn btn-connect" onclick="login()">ENTER PANEL</button>
        <div id="login-err" class="error">ACCESS DENIED</div>
    </div>

    <!-- ВЫБОР СЕРВЕРОВ -->
    <div id="server-panel">
        <label>AVAILABLE LOCATIONS</label>
        <div class="server-list">
            <div class="server-item" onclick="select(this)">
                <img src="https://flagcdn.com" class="flag-img">
                <div class="server-info">
                    <span class="server-name">Germany, Frankfurt</span>
                    <span class="server-status">Online (12ms)</span>
                </div>
            </div>
            <div class="server-item" onclick="select(this)">
                <img src="https://flagcdn.com" class="flag-img">
                <div class="server-info">
                    <span class="server-name">USA, New York</span>
                    <span class="server-status">Online (98ms)</span>
                </div>
            </div>
            <div class="server-item" onclick="select(this)">
                <img src="https://flagcdn.com" class="flag-img">
                <div class="server-info">
                    <span class="server-name">Russia, Moscow</span>
                    <span class="server-status">Online (5ms)</span>
                </div>
            </div>
            <div class="server-item" onclick="select(this)">
                <img src="https://cdn-icons-png.flaticon.com" class="flag-img">
                <div class="server-info">
                    <span class="server-name">Discord Tunnel</span>
                    <span class="server-status">Optimized</span>
                </div>
            </div>
        </div>
        <button class="btn btn-connect" style="margin-top: 25px;" onclick="alert('Connecting...')">CONNECT NOW</button>
    </div>
</div>

<script>
    function login() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u === 'loqin' && p === 'house2233') {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('server-panel').style.display = 'block';
        } else {
            document.getElementById('login-err').style.display = 'block';
            setTimeout(() => document.getElementById('login-err').style.display = 'none', 2000);
        }
    }

    function select(el) {
        document.querySelectorAll('.server-item').forEach(s => s.classList.remove('active'));
        el.classList.add('active');
    }
</script>

</body>
</html>
