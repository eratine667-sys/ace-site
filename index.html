<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VirtuX VPN</title>
    <style>
        body { background-color: #0c0c0c; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { 
            background-color: #1a1a1a; padding: 40px; border-radius: 20px; 
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.5); width: 380px; 
            text-align: center; border: 2px solid #ff0000; 
        }
        h1 { font-size: 42px; margin-bottom: 30px; letter-spacing: 2px; font-weight: 900; text-transform: uppercase; }
        .red-text { color: #ff0000; }
        .white-text { color: #ffffff; }

        input { 
            width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #333; 
            background: #222; color: white; box-sizing: border-box; outline: none; font-size: 16px; margin-bottom: 15px;
        }
        input:focus { border-color: #ff0000; }

        .btn-connect { 
            width: 100%; padding: 16px; border: none; border-radius: 10px; 
            font-weight: 900; cursor: pointer; transition: 0.3s; font-size: 14px;
            background-color: #ff0000; color: white;
        }
        .btn-connect:hover { background-color: #cc0000; transform: scale(1.02); }

        #server-panel { display: none; }
        .server-list { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        
        .server-item { 
            background: #252525; padding: 15px; border-radius: 12px; border: 1px solid #333; 
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 15px;
        }
        .server-item:hover { border-color: #ff0000; }
        .server-item.active { border-color: #ff0000; background: #350505; box-shadow: 0 0 15px rgba(255,0,0,0.3); }

        /* Сюда вставляешь ссылки на фото/гитхаб */
        .flag-img { width: 50px; height: 35px; border-radius: 6px; object-fit: cover; background: #333; }
        
        .server-info { text-align: left; flex-grow: 1; }
        .server-name { display: block; font-weight: bold; font-size: 14px; }
        .ping-box { font-size: 11px; color: #ff0000; font-family: monospace; }

        .error { color: #ff0000; font-size: 12px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1><span class="red-text">virtu</span><span class="white-text">x</span> <span class="white-text">vpn</span></h1>

    <div id="login-form">
        <input type="text" id="user" placeholder="LOGIN">
        <input type="password" id="pass" placeholder="PASSWORD">
        <button class="btn-connect" onclick="login()">ENTER PANEL</button>
        <div id="login-err" class="error">WRONG AUTH</div>
    </div>

    <div id="server-panel">
        <div class="server-list">
            <!-- Замени src на свои ссылки из GitHub, если эти не грузятся -->
            <div class="server-item" onclick="select(this)">
                <img src="https://flagcdn.com" class="flag-img">
                <div class="server-info">
                    <span class="server-name">GERMANY, FRANKFURT</span>
                    <span class="ping-box">PING: <span class="ping-val">15</span>ms</span>
                </div>
            </div>
            <div class="server-item" onclick="select(this)">
                <img src="https://flagcdn.com" class="flag-img">
                <div class="server-info">
                    <span class="server-name">USA, VIRGINIA</span>
                    <span class="ping-box">PING: <span class="ping-val">110</span>ms</span>
                </div>
            </div>
            <div class="server-item" onclick="select(this)">
                <img src="https://flagcdn.com" class="flag-img">
                <div class="server-info">
                    <span class="server-name">RUSSIA, MOSCOW</span>
                    <span class="ping-box">PING: <span class="ping-val">8</span>ms</span>
                </div>
            </div>
            <div class="server-item" onclick="select(this)">
                <img src="https://cdn-icons-png.flaticon.com" class="flag-img">
                <div class="server-info">
                    <span class="server-name">DISCORD BYPASS</span>
                    <span class="ping-box">PING: <span class="ping-val">22</span>ms</span>
                </div>
            </div>
        </div>
        <button id="conn-btn" class="btn-connect" style="margin-top: 20px;">START VPN</button>
    </div>
</div>

<script>
    function login() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u === 'loqin' && p === 'house2233') {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('server-panel').style.display = 'block';
            startPingUpdate();
        } else {
            document.getElementById('login-err').style.display = 'block';
        }
    }

    function select(el) {
        document.querySelectorAll('.server-item').forEach(s => s.classList.remove('active'));
        el.classList.add('active');
    }

    // Рандомное обновление пинга для вида
    function startPingUpdate() {
        setInterval(() => {
            document.querySelectorAll('.ping-val').forEach(span => {
                let current = parseInt(span.innerText);
                let shift = Math.floor(Math.random() * 5) - 2; // +/- 2ms
                span.innerText = Math.max(5, current + shift);
            });
        }, 2000);
    }
</script>

</body>
</html>
